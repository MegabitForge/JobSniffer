[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-sniffer"
version = "0.1.0"
description = "Desktop application for collecting and evaluating job offers."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "flet",
    "httpx",
    "keyring",
    "linkedin-jobs-scraper",
    "ollama",
    "openai",
    "platformdirs",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "pymupdf4llm",
    "selectolax",
    "selenium>=4.47.0",
    "setuptools>=84.0.0",
    "sqlalchemy>=2.0.52",
    "undetected-chromedriver>=3.5.5",
]

[project.scripts]
job-sniffer = "job_sniffer.app:run"

[dependency-groups]
dev = [
    "flet-cli",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_sniffer"]

[tool.flet.app]
path = "src"
module = "main"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
packages = ["job_sniffer"]
strict = true

[tool.basedpyright]
typeCheckingMode = "strict"

reportAny = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
